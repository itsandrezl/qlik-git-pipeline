name: Valida sincronização script.qvs

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/**/sections/*.qvs'
      - 'apps/**/script.qvs'
      - 'includes/*.qvs'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar sincronização
        run: python tools/export_qlik_scripts.py --check-assemble
